# Build and publish HookDeploy Agent for Windows x64, macOS Apple Silicon, and macOS Intel.
# Do not cut a tag until signing secrets exist on both platforms. This workflow is not triggered here.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            platform: windows-latest
            rust_targets: ""
            args: ""
            sidecar_goos: windows
            sidecar_goarch: amd64
            sidecar_out: hookdeployed-x86_64-pc-windows-msvc.exe
            # Native Windows (no --target): Cargo writes target/release/.
            # https://v2.tauri.app/plugin/updater/ — nsis/ and msi/ under bundle/
            artifact_path: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          # macos-latest is Apple Silicon; Intel is cross-compiled from the same runner
          # (Tauri's documented GitHub matrix, not a second physical Intel Mac).
          - name: macos-arm64
            platform: macos-latest
            rust_targets: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
            sidecar_goos: darwin
            sidecar_goarch: arm64
            sidecar_out: hookdeployed-aarch64-apple-darwin
            # --target prefixes the triple (same rule as Windows installer docs).
            # https://v2.tauri.app/distribute/windows-installer/
            artifact_path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macos-x64
            platform: macos-latest
            rust_targets: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
            sidecar_goos: darwin
            sidecar_goarch: amd64
            sidecar_out: hookdeployed-x86_64-apple-darwin
            artifact_path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: hookdeploy/hookdeployed
          path: hookdeployed-src

      - uses: actions/setup-go@v5
        with:
          go-version-file: hookdeployed-src/go.mod

      - name: Build hookdeployed sidecar
        working-directory: hookdeployed-src
        shell: bash
        run: |
          mkdir -p ../src-tauri/binaries
          CGO_ENABLED=0 GOOS=${{ matrix.sidecar_goos }} GOARCH=${{ matrix.sidecar_goarch }} \
            go build -trimpath -ldflags="-s -w" \
            -o "../src-tauri/binaries/${{ matrix.sidecar_out }}" ./cmd/agent
          chmod +x "../src-tauri/binaries/${{ matrix.sidecar_out }}" || true

      # SignTool must be able to write Authenticode into the PE. Read-only
      # sidecars make Azure Trusted Signing exit 0-ish / verify as unsigned
      # ("No signature found") — see tauri-apps/tauri#11778.
      - name: Ensure Windows sidecar is writable for SignTool
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = "src-tauri/binaries/${{ matrix.sidecar_out }}"
          if (-not (Test-Path $p)) { throw "missing sidecar: $p" }
          attrib -R $p
          Get-Item $p | Format-List FullName, Length, IsReadOnly, Attributes

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # OpenSSL 3 (and Windows openssl) writes PKCS#12 with PBES2/SHA-256 MAC.
          # openssl on the runner accepts that file+password; SecKeychainItemImport
          # does not and reports "MAC verification failed (wrong password?)".
          # Re-export with SHA1+3DES before import.
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          umask 077
          PEM="$RUNNER_TEMP/identity.pem"
          LEGACY="$RUNNER_TEMP/certificate-legacy.p12"
          openssl pkcs12 -in certificate.p12 -nodes -passin env:APPLE_CERTIFICATE_PASSWORD -out "$PEM"
          if openssl pkcs12 -export -help 2>&1 | grep -q -- '-legacy'; then
            openssl pkcs12 -export -legacy -in "$PEM" -out "$LEGACY" -passout env:APPLE_CERTIFICATE_PASSWORD
          else
            openssl pkcs12 -export -in "$PEM" -out "$LEGACY" -passout env:APPLE_CERTIFICATE_PASSWORD \
              -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1
          fi
          rm -f "$PEM" certificate.p12
          # tauri-action also runs `security import` from APPLE_CERTIFICATE during
          # codesign. Point that at the SHA1+3DES p12, not the original secret.
          {
            echo "APPLE_CERTIFICATE<<CERT_EOF"
            openssl base64 -A -in "$LEGACY"
            echo
            echo "CERT_EOF"
          } >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$LEGACY" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$LEGACY"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
          CERT_ID=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"
          echo "${{ secrets.APPLE_API_KEY_P8 }}" > AuthKey.p8
          echo "APPLE_API_KEY_PATH=${PWD}/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Write Windows signCommand overlay
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Object-form signCommand (quotes/spaces safe). Invoke our wrapper so
          # %1 is resolved to an absolute path before SignTool/dlib sees it.
          $script = Join-Path $env:GITHUB_WORKSPACE "scripts\sign-windows.ps1"
          $overlay = @{
            bundle = @{
              windows = @{
                signCommand = @{
                  cmd = "powershell"
                  args = @(
                    "-NoProfile",
                    "-ExecutionPolicy", "Bypass",
                    "-File", $script,
                    "%1"
                  )
                }
              }
            }
          }
          $overlay | ConvertTo-Json -Depth 8 | Set-Content -Path src-tauri/windows-sign.ci.json -Encoding utf8
          Get-Content src-tauri/windows-sign.ci.json

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ env.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: HookDeploy Agent ${{ github.ref_name }}
          releaseBody: See the assets to download this version.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          args: ${{ matrix.name == 'windows' && '--verbose --config src-tauri/windows-sign.ci.json' || matrix.args }}

      # Always upload installers so workflow_dispatch test runs have a download.
      # tauri-action still attaches the same files to a GitHub Release when a
      # v* tag fires (tagName / releaseDraft above are unchanged).
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hookdeploy-agent-${{ matrix.name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 7

  latest-json:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Assemble latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ github.ref_name }}
        run: node scripts/assemble-latest-json.mjs
      - name: Upload latest.json to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" latest.json --clobber

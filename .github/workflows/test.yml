name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  npm-test:
    name: npm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  cargo-test:
    name: cargo test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      # tauri-build requires the host-triple sidecar path even for unit tests.
      # Release CI builds real binaries; this job only needs the file to exist.
      - name: Stub Linux sidecar for tauri-build
        working-directory: .
        run: |
          mkdir -p src-tauri/binaries
          : > src-tauri/binaries/hookdeployed-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/hookdeployed-x86_64-unknown-linux-gnu
      - run: cargo test
